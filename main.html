<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starter UI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background: #f4f6f8;
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            background: #1f2937;
            color: white;
            padding: 20px;
        }

        .sidebar h2 {
            margin-bottom: 20px;
        }

        .sidebar a {
            display: block;
            padding: 10px;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .sidebar a:hover {
            background: #374151;
        }

        /* Main */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: white;
            padding: 16px 24px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-size: 20px;
            font-weight: bold;
        }

        /* Content */
        .content {
            padding: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        /* Cards */
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }

        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>My App</h2>
        <a href="#">Dashboard</a>
        <a href="#">Profile</a>
        <a href="#">Settings</a>
    </div>

    <div class="main">
        <div class="header">
            Dashboard
        </div>

        <div class="content">
            <div class="card">
                <h3>Users</h3>
                <p>120 Active</p>
                <button class="btn">View</button>
            </div>

            <div class="card">
                <h3>Orders</h3>
                <p>75 Pending</p>
                <button class="btn">View</button>
            </div>

            <div class="card">
                <h3>Revenue</h3>
                <p>$5,200</p>
                <button class="btn">View</button>
            </div>
        </div>
    </div>

</body>
</html>
