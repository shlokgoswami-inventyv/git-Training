<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starter UI</title>
    <link rel="stylesheet" href="feature.css">
</head>

<body>

    <div class="sidebar">
        <h2>My App</h2>
        <a href="#">Dashboard</a>

    <div class="main">

            Dashboard
        </div>

        <div class="content">
